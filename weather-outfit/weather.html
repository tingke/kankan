<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天气</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .weather-card {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.9);
    }
    .glass-effect {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-400 via-blue-500 to-blue-600">
  <div class="h-full overflow-y-auto pb-20">
    <div class="p-6 pt-8">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-white text-2xl font-bold">北京市</h1>
          <p class="text-blue-100 text-sm">朝阳区</p>
        </div>
        <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
          <i class="fas fa-location-dot text-white"></i>
        </div>
      </div>

      <div class="text-center mb-8">
        <div class="mb-4">
          <i class="fas fa-cloud-sun text-yellow-300 text-8xl"></i>
        </div>
        <div class="text-white text-7xl font-light mb-2">-3°</div>
        <div class="text-blue-100 text-lg">多云转晴</div>
        <div class="text-blue-200 text-sm mt-2">体感温度 -6°</div>
      </div>

      <div class="weather-card rounded-2xl p-4 mb-4 shadow-lg">
        <div class="grid grid-cols-3 gap-4 text-center">
          <div>
            <i class="fas fa-wind text-blue-500 text-xl mb-2"></i>
            <p class="text-gray-500 text-xs">风速</p>
            <p class="text-gray-800 font-semibold">3级</p>
          </div>
          <div>
            <i class="fas fa-droplet text-blue-500 text-xl mb-2"></i>
            <p class="text-gray-500 text-xs">湿度</p>
            <p class="text-gray-800 font-semibold">45%</p>
          </div>
          <div>
            <i class="fas fa-eye text-blue-500 text-xl mb-2"></i>
            <p class="text-gray-500 text-xs">能见度</p>
            <p class="text-gray-800 font-semibold">10km</p>
          </div>
        </div>
      </div>

      <div class="weather-card rounded-2xl p-4 mb-4 shadow-lg">
        <h3 class="font-semibold text-gray-800 mb-4">今日详情</h3>
        <div class="space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-gray-500 text-sm">日出</span>
            <span class="text-gray-800 font-medium">07:18</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-gray-500 text-sm">日落</span>
            <span class="text-gray-800 font-medium">17:02</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-gray-500 text-sm">最高温度</span>
            <span class="text-gray-800 font-medium">2°</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-gray-500 text-sm">最低温度</span>
            <span class="text-gray-800 font-medium">-8°</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-gray-500 text-sm">空气质量</span>
            <span class="text-green-600 font-medium">优 42</span>
          </div>
        </div>
      </div>

      <div class="weather-card rounded-2xl p-4 mb-4 shadow-lg">
        <h3 class="font-semibold text-gray-800 mb-4">未来7天</h3>
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-gray-600 text-sm w-12">今天</span>
            <i class="fas fa-cloud-sun text-yellow-400 text-xl"></i>
            <div class="flex items-center gap-2">
              <span class="text-gray-800 font-medium">2°</span>
              <span class="text-gray-400">/</span>
              <span class="text-gray-500">-8°</span>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-gray-600 text-sm w-12">周五</span>
            <i class="fas fa-sun text-yellow-400 text-xl"></i>
            <div class="flex items-center gap-2">
              <span class="text-gray-800 font-medium">3°</span>
              <span class="text-gray-400">/</span>
              <span class="text-gray-500">-7°</span>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-gray-600 text-sm w-12">周六</span>
            <i class="fas fa-cloud text-gray-400 text-xl"></i>
            <div class="flex items-center gap-2">
              <span class="text-gray-800 font-medium">1°</span>
              <span class="text-gray-400">/</span>
              <span class="text-gray-500">-9°</span>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-gray-600 text-sm w-12">周日</span>
            <i class="fas fa-snowflake text-blue-400 text-xl"></i>
            <div class="flex items-center gap-2">
              <span class="text-gray-800 font-medium">-2°</span>
              <span class="text-gray-400">/</span>
              <span class="text-gray-500">-10°</span>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-gray-600 text-sm w-12">周一</span>
            <i class="fas fa-sun text-yellow-400 text-xl"></i>
            <div class="flex items-center gap-2">
              <span class="text-gray-800 font-medium">4°</span>
              <span class="text-gray-400">/</span>
              <span class="text-gray-500">-6°</span>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-gray-600 text-sm w-12">周二</span>
            <i class="fas fa-cloud-sun text-yellow-400 text-xl"></i>
            <div class="flex items-center gap-2">
              <span class="text-gray-800 font-medium">5°</span>
              <span class="text-gray-400">/</span>
              <span class="text-gray-500">-5°</span>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-gray-600 text-sm w-12">周三</span>
            <i class="fas fa-cloud text-gray-400 text-xl"></i>
            <div class="flex items-center gap-2">
              <span class="text-gray-800 font-medium">2°</span>
              <span class="text-gray-400">/</span>
              <span class="text-gray-500">-7°</span>
            </div>
          </div>
        </div>
      </div>

      <a href="ootd.html" class="glass-effect rounded-2xl p-4 shadow-lg block cursor-pointer hover:bg-white/90 transition-colors">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold text-gray-800">穿衣建议</h3>
          <span class="flex items-center gap-1 text-blue-500 text-xs font-medium">
            查看穿搭推荐
            <i class="fas fa-chevron-right text-xs"></i>
          </span>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
            <i class="fas fa-mitten text-blue-500 text-xl"></i>
          </div>
          <div class="flex-1">
            <p class="text-gray-800 font-medium">建议穿羽绒服、毛衣等保暖衣物</p>
            <p class="text-gray-500 text-xs">注意防寒保暖，外出请佩戴口罩</p>
          </div>
        </div>
      </a>
    </div>
  </div>
</body>
</html>

    <script>
      $(function () {
        let preShowItem = {};
        let preHideItem = {};
        let preItem = {};
        function handleDetailSection() {
          const currentScroll = $(document).scrollTop();
          const windowHeight = $(window).height();
          const el = $('.detail-section');
          const height = el.height();
          const offsetTop = el.offset().top;

          const range = [
            { start: 0, end: 1 / 6 },
            { start: 1 / 6, end: 2 / 6 },
            { start: 2 / 6, end: 3 / 6 },
            { start: 3 / 6, end: 4 / 6 },
            { start: 4 / 6, end: 5 / 6 },
            { start: 5 / 6, end: 6 / 6 },
          ];

          const q = [
            { index: 0, start: 0, end: 1 / 6, isShow: true },
            { index: 0, start: 1 / 6, end: 2 / 6, isShow: false },
            { index: 1, start: 1 / 6, end: 2 / 6, isShow: true },
            { index: 1, start: 2 / 6, end: 3 / 6, isShow: false },
            { index: 2, start: 2 / 6, end: 3 / 6, isShow: true },
            { index: 2, start: 3 / 6, end: 4 / 6, isShow: false },
            { index: 3, start: 3 / 6, end: 4 / 6, isShow: true },
            { index: 3, start: 4 / 6, end: 5 / 6, isShow: false },
            { index: 4, start: 4 / 6, end: 5 / 6, isShow: true },
            { index: 4, start: 5 / 6, end: 6 / 6, isShow: false },
          ];

          if (currentScroll > offsetTop - windowHeight && currentScroll <= offsetTop + height) {
            // 从入屏到出屏的进度百分比
            const percent = (currentScroll - (offsetTop - windowHeight)) / (windowHeight + height);
            let item = {};
            range.forEach(function (i, index) {
              if (percent >= i.start && percent < i.end) {
                item = { index, start: i.start, end: i.end };
              }
            });
            let showItem = {};
            let hideItem = {};
            q.forEach(function (i) {
              if (percent >= i.start && percent < i.end) {
                if (i.isShow) {
                  showItem = i;
                } else {
                  hideItem = i;
                }
              }
            });
            if (preItem.index !== item.index) {
              $('.detail-left-show').empty();
              $('.detail-word-show').empty();
              $('.detail-right-show').empty();
              $('.detail-left-hide').empty();
              $('.detail-word-hide').empty();
              $('.detail-right-hide').empty();
              preItem = item;
            }
            if (preShowItem.index !== showItem.index) {
              $('.detail-left-show').html($($('#detailleft' + (showItem.index + 1)).html()));
              $('.detail-word-show').html($($('#detailword' + (showItem.index + 1)).html()));
              $('.detail-right-show').html($($('#detailright' + (showItem.index + 1)).html()));
              preShowItem = showItem;
            }
            if (preHideItem.index !== hideItem.index) {
              $('.detail-left-hide').html($($('#detailleft' + (hideItem.index + 1)).html()));
              $('.detail-word-hide').html($($('#detailword' + (hideItem.index + 1)).html()));
              $('.detail-right-hide').html($($('#detailright' + (hideItem.index + 1)).html()));
              preShowItem = showItem;
            }
            // 计算当前进度百分比
            const p = (percent - item.start) / (item.end - item.start);
            scrollShow($('.detail-left-show'), p);
            scrollShow($('.detail-word-show'), p);
            scrollShow($('.detail-right-show'), p);
            scrollHide($('.detail-left-hide'), p);
            scrollHide($('.detail-word-hide'), p);
            scrollHide($('.detail-right-hide'), p);
          }

          if (
            currentScroll >= offsetTop - windowHeight &&
            currentScroll <= offsetTop + height - windowHeight
          ) {
            // 从入屏到出屏的进度百分比
            const percent = (currentScroll - (offsetTop - windowHeight)) / windowHeight;
            scrollShow(el.find('.header'), percent);
          }

          if (
            currentScroll > offsetTop + height - windowHeight &&
            currentScroll <= offsetTop + height
          ) {
            const percent = (currentScroll - (offsetTop + height - windowHeight)) / windowHeight;
            scrollHide(el.find('.header'), percent);
          }
        }

        window.hua.subject();

        let scrolled = false;
        function scrollPage() {
          handleDetailSection();
          handleSection('.preview-section');
          handleSection('.intro-section');
          handleSection('.gallery-section');
          scrolled = false;
        }
        function scrollHandler() {
          if (!scrolled) {
            scrolled = true;
            window.requestAnimationFrame(function () {
              scrollPage();
            });
          }
        }

        scrollHandler();

        $(window).resize(function () {
          scrollHandler();
        });

        $(window).scroll(scrollHandler);
      });
    </script>
